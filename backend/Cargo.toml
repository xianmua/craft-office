[package]
name = "artcraft-office"
version = "0.1.0"
edition = "2021"
description = "ArtCraft 单人在线 Office（docx / xlsx / pptx）后端服务"

[dependencies]
actix-web = "4.9"
actix-files = "0.6"
actix-cors = "0.7"
reqwest = { version = "0.12", features = ["stream", "json", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
url = "2.5"
mime = "0.3"
futures-util = "0.3"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
dotenvy = "0.15"
ipnet = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
